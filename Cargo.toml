[package]
name = "oox-tui"
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
description = "Terminal UI for inspecting, comparing, and editing Office Open XML (.docx, .xlsx, .pptx) files"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sergey-tihon/oox"
include = ["Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**/*", "data/sample.pptx"]
keywords = ["ooxml", "docx", "xlsx", "pptx", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oox"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
crossterm-keybind = "0.4.3"
dirs = "7.0"
serde = { version = "1", features = ["derive"] }
# `preserve_order`/`arbitrary_precision` keep an edited JSON part byte-faithful:
# key order and number literals (`1.10`) survive the pretty-print round trip.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
ratatui = "0.30"
tui-tree-widget = "0.24"
edtui = { version = "0.11", default-features = false, features = ["syntax-highlighting", "mouse-support"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive"] }
similar = "3"
