[package]
name = "oox"
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
description = "A terminal UI for inspecting Office Open XML documents"
readme = "README.md"
license = "MIT"
repository = "https://github.com/sergey-tihon/ooxml-tui"
keywords = ["ooxml", "office", "tui", "xml", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "oox"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
crossterm-keybind = "0.4.3"
dirs = "6.0"
serde = { version = "1", features = ["derive"] }
ratatui = "0.30"
tui-tree-widget = "0.24"
edtui = { version = "0.11", default-features = false, features = ["syntax-highlighting"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive"] }
